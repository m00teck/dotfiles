"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$terraform\
$aws\
$gcloud\
$cmd_duration\
$line_break\
$character"""

add_newline = false
command_timeout = 500

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
format = "[$path]($style) "

[git_branch]
symbol = "git:"
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"
modified = "!"
staged = "+"
untracked = "?"

[kubernetes]
disabled = false
symbol = "k8s:"
style = "bold cyan"
format = '[$symbol$context(\($namespace\))]($style) '

[kubernetes.context_aliases]
"arn:aws:eks:[\\w-]+:\\d+:cluster/(?P<cluster>[\\w-]+)" = "eks-$cluster"
"gke_[\\w-]+_[\\w-]+_(?P<cluster>[\\w-]+)" = "gke-$cluster"

[terraform]
symbol = "tf:"
style = "bold 105"
format = "[$symbol$workspace]($style) "

[aws]
symbol = "aws:"
style = "bold yellow"
format = "[$symbol$profile]($style) "

[gcloud]
symbol = "gcp:"
style = "bold blue"
format = "[$symbol$project]($style) "

[cmd_duration]
min_time = 2_000
style = "dimmed yellow"
format = "[($duration)]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
